    # Web root is public/ — app/, storage/, secrets/ are NOT web-accessible
    root __INSTALL_DIR__/public;
    index index.php index.html;

    # Maximum upload size — must be >= PHP post_max_size / upload_max_filesize
    # (see docker/php/php.ini). Without this, nginx rejects uploads >1M with 413.
    client_max_body_size 100M;

    # Security: Deny access to hidden files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    #sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
    location __PATH__/ {
        try_files $uri $uri/ /index.php?$args;
    }

    # API location — proxied through public/api/index.php → app/api/index.php
    location __PATH__/api/ {
        try_files $uri $uri/ /api/index.php?$args;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
        include fastcgi_params_with_auth;

        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # Buffer sizes
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        more_set_headers "Cache-Control : public, immutable";
        access_log off;
    }

    # Deny access to specific files
    location ~ ^__PATH__/(\.|composer\.json|composer\.lock|package\.json|README\.md|CHANGELOG\.md) {
        deny all;
        return 404;
    }

    # Health check endpoint
    location __PATH__/health {
        access_log off;
        return 200 "healthy\n";
        more_set_headers "Content-Type: text/plain";
    }